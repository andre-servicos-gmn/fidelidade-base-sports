# Configuração do Alembic.
# A URL do banco NÃO fica aqui — é lida da config (.env) dentro de env.py.

[alembic]
script_location = app/alembic
prepend_sys_path = .
# sqlalchemy.url é deliberadamente deixado em branco; env.py o injeta a partir
# de Settings.database_url (DATABASE_URL no .env).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
