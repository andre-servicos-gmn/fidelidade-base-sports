server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: o react-router resolve as rotas no cliente. Sem este try_files,
    # recarregar a página em /clientes devolve 404 do nginx em vez do painel —
    # a rota só existe depois que o JS carrega.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados agressivamente; o index.html
    # não, senão o navegador serve uma versão velha depois de um deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
